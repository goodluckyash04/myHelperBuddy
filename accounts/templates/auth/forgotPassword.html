{% extends 'index.html' %}
{% load static %}
{% block mainbody %}
<div style="min-height: 90vh; display: flex; align-items: center; justify-content: center;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <form method="post" action="/forgotPassword/" class="premium-card p-4 p-md-5">

          {% csrf_token %}
          <h2 class="text-center mb-3">
            <a class="text-decoration-none" style="color: var(--accent-gold-dark); font-family: var(--font-serif); font-weight: 700; font-size: 2.5rem; letter-spacing: -0.05em;" href="/">MyHelperBuddy</a>
          </h2>

          <p class="fs-5 text-center mb-1" style="color: var(--text-secondary); font-weight: 500;">Forgot Password</p>
          <p class="mb-4 text-center text-tertiary" style="font-size: 0.9rem;">Password will be sent to your registered email</p>

          <div class="mb-3">
            <input
              type="text"
              placeholder="Username / Email"
              class="form-control form-control-fintech form-control-lg"
              name="username"
              id="username"
              aria-describedby="usernameHelp"
              required
            />
          </div>

          <p class="text-danger mb-3 text-center fw-semibold">{{ msg }}</p>

          <div class="d-grid mb-3 mt-4">
            <button
              type="submit"
              class="btn btn-fintech-primary btn-lg"
            >
              SUBMIT
            </button>
          </div>

          <div class="text-center">
            <a href="/login" class="text-secondary text-decoration-none" style="font-weight: 500;">
              Password Remembered? <b style="color: var(--accent-gold-dark);">Sign In</b>
            </a>
          </div>

        </form>

      </div>
    </div>
  </div>

</div>
{% endblock mainbody %}
