{% extends 'body.html' %}
{% load static %}
{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:70vh">
  <div class="card shadow p-4 text-center" style="max-width:440px;width:100%;border-radius:18px;">
    <h2 class="text-center mb-3">
      <a class="text-decoration-none" style="color: var(--primary); font-family: 'Rubik Vinyl', cursive; font-weight: 500; font-size: 2.5rem;" href="/">MyHelperBuddy</a>
    </h2>
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
      <i class="fa-solid fa-link-slash" style="color:#ef4444;font-size:1.5rem;"></i>
    </div>
    <h5 class="fw-bold mb-2" style="color:#1f2937;">Link Invalid or Expired</h5>
    <p class="text-muted mb-4" style="font-size:0.9rem;">{{ msg }}</p>
    <a href="/forgotPassword/" class="btn custom-btn-primary rounded-3 fw-semibold">
      Request a New Reset Link
    </a>
    <div class="mt-3">
      <a href="/login" class="small" style="color:var(--primary);">Back to Login</a>
    </div>
  </div>
</div>
{% endblock body %}
