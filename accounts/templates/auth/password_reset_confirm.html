{% extends 'body.html' %}
{% load static %}
{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height:70vh">
  <div class="card shadow p-4" style="max-width:440px;width:100%;border-radius:18px;">
    <div class="text-center mb-4">
      <h2 class="text-center mb-3">
        <a class="text-decoration-none" style="color: var(--primary); font-family: 'Rubik Vinyl', cursive; font-weight: 500; font-size: 2.5rem;" href="/">MyHelperBuddy</a>
      </h2>
      <h4 class="mt-3" style="color:var(--primary);font-family:'Dancing Script',cursive;">Set New Password</h4>
    </div>

    {% if msg %}
    <div class="alert alert-danger rounded-3" id="autoCloseAlert">{{ msg }}</div>
    {% endif %}

    <form method="POST" action="">
      {% csrf_token %}
      <input type="hidden" name="uidb64" value="{{ uidb64 }}">
      <input type="hidden" name="token"  value="{{ token }}">

      <div class="mb-3">
        <label class="form-label small fw-semibold">New Password</label>
        <input type="password" name="new_password" id="new_password"
               class="form-control rounded-3" placeholder="Enter your new password" required>
        <p class="small text-muted" style="font-size: 0.8rem;">Minimum 8 characters</p>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password"
               class="form-control rounded-3" placeholder="Re-enter your new password" required>
      </div>

      <button type="submit" class="btn w-100 custom-btn-primary rounded-3 fw-semibold">
        Update Password
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="/login" class="small" style="color:var(--primary);">Back to Login</a>
    </div>
  </div>
</div>
{% endblock body %}
