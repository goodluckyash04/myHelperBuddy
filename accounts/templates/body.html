{% extends 'index.html' %}
{% load static %}

{% block mainbody %}

<header>
    {% block header %}
    {% endblock header %}
</header>
<body>
    <div style="min-height: 80vh; padding-bottom: 100px;">
    {% block body %}
    {% endblock body  %}
    </div> 

    <!-- Global Quick Entry FAB (Signature CTA) -->
    {% if user.is_authenticated %}
    <a href="javascript:void(0)" onclick="openGlobalQuickEntry()" class="btn rounded-circle shadow-lg" 
       style="position: fixed; bottom: 32px; right: 32px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; z-index: 1040; background: var(--gradient-signature); transition: transform 0.2s ease;"
       onmouseover="this.style.transform='scale(1.05)';"
       onmouseout="this.style.transform='scale(1)';"
       title="Quick Add Entry">
      <i class="fa-solid fa-plus fs-4" style="color: #1a1a1a;"></i>
    </a>

    <!-- Global Quick Entry Modal -->
    <div class="modal fade" id="globalEntryModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-lg); background-color: var(--bg-surface);">
          <div class="modal-header border-0 pb-0 pt-4 px-4">
            <h5 class="modal-title fw-bold" style="color: var(--text-primary); font-family: var(--font-serif); letter-spacing: -0.5px;">Log Transaction</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4" id="globalEntryModalBody">
            <div class="text-center py-5">
              <div class="spinner-border" style="color: var(--accent-gold);" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    {% endif %}

    <script>
    function openGlobalQuickEntry() {
      // Show the modal instantly
      const modalElement = document.getElementById('globalEntryModal');
      const modalBody = document.getElementById('globalEntryModalBody');
      const bsModal = new bootstrap.Modal(modalElement);
      bsModal.show();
      
      // Show loading spinner just in case
      modalBody.innerHTML = `
        <div class="text-center py-5">
          <div class="spinner-border" style="color: var(--accent-gold);" role="status"></div>
        </div>
      `;

      // Fetch the entry creation form
      fetch('{% url "finance:entry_create" %}')
        .then(response => response.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const formWrapper = doc.querySelector('#quick-entry-form-wrapper');
          
          if (formWrapper) {
            modalBody.innerHTML = '';
            modalBody.appendChild(formWrapper);
            
            // Re-evaluate any scripts that came with the form (essential for the Expense/Income toggles)
            const scripts = formWrapper.querySelectorAll('script');
            scripts.forEach(script => {
              const newScript = document.createElement('script');
              newScript.textContent = script.textContent;
              document.body.appendChild(newScript);
            });
            
            // Re-bind modal-specific behaviors if needed
            const form = formWrapper.querySelector('form');
            if(form) {
               // When submitted, it will post normally and redirect per standard django flow, giving a seamless experience
            }
          } else {
            modalBody.innerHTML = '<div class="alert alert-danger">Failed to load quick entry form.</div>';
          }
        })
        .catch(err => {
          modalBody.innerHTML = '<div class="alert alert-danger">Network error. Please try again.</div>';
        });
    }
    </script>
</body>

{% endblock mainbody %}
