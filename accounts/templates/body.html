{% extends 'index.html' %}
{% load static %}

{% block mainbody %}

<header>
  {% block header %}
  {% endblock header %}
</header>

<body>
  <div style="min-height: 80vh; padding-bottom: 120px;">
    {% block body %}
    {% endblock body %}
  </div>

  {% if user.is_authenticated %}
  <!-- ── Global Quick Entry FAB ── -->
  <a href="javascript:void(0)"
     onclick="openGlobalQuickEntry()"
     class="fab-pulse"
     id="globalFAB"
     title="Quick Add Entry"
     aria-label="Quick Add Transaction"
     style="
       position: fixed;
       bottom: 2rem; right: 2rem;
       width: 60px; height: 60px;
       border-radius: 50%;
       background: var(--gold-gradient);
       display: flex; align-items: center; justify-content: center;
       z-index: 1040;
       box-shadow: var(--shadow-gold-lg), var(--shadow-md);
       transition: transform 0.2s ease, box-shadow 0.2s ease;
       border: 1px solid rgba(255,255,255,0.1);
     "
     onmouseover="this.style.transform='scale(1.1) rotate(90deg)'; this.style.boxShadow='var(--shadow-gold-lg), 0 0 0 8px var(--gold-soft)';"
     onmouseout="this.style.transform='scale(1) rotate(0)'; this.style.boxShadow='var(--shadow-gold-lg), var(--shadow-md)';">
    <i class="fa-solid fa-plus" style="color: var(--text-on-accent); font-size: 1.3rem;"></i>
  </a>

  <!-- ── Global Quick Entry Modal ── -->
  <div class="modal fade" id="globalEntryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      ">
        <div class="modal-header" style="
          background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-surface) 100%);
          border-bottom: 1px solid var(--border-color);
          padding: 1.25rem 1.75rem;
        ">
          <div class="d-flex align-items-center gap-3">
            <div style="
              width: 2.25rem; height: 2.25rem;
              border-radius: var(--radius-md);
              background: var(--gold-soft);
              border: 1px solid var(--border-accent);
              display: flex; align-items: center; justify-content: center;
              color: var(--gold); font-size: 0.9rem;
            ">
              <i class="fa-solid fa-bolt"></i>
            </div>
            <h5 class="modal-title" style="
              font-family: var(--font-serif);
              color: var(--text-primary);
              font-weight: 700;
              letter-spacing: -0.02em;
              margin: 0;
            ">Quick Log Transaction</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="globalEntryModalBody" style="padding: 1.75rem; background: var(--bg-surface);">
          <div class="text-center py-5">
            <div class="spinner-border" style="color: var(--gold); width: 2rem; height: 2rem;" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3" style="color: var(--text-tertiary); font-size: 0.85rem;">Loading form...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  function openGlobalQuickEntry() {
    const modalElement = document.getElementById('globalEntryModal');
    const modalBody = document.getElementById('globalEntryModalBody');
    const bsModal = new bootstrap.Modal(modalElement);
    bsModal.show();

    modalBody.innerHTML = `
      <div class="text-center py-5">
        <div class="spinner-border" style="color: var(--gold); width: 2rem; height: 2rem;" role="status"></div>
        <p class="mt-3" style="color: var(--text-tertiary); font-size: 0.85rem;">Loading form...</p>
      </div>`;

    fetch('{% url "finance:entry_create" %}')
      .then(r => r.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const formWrapper = doc.querySelector('#quick-entry-form-wrapper');
        if (formWrapper) {
          modalBody.innerHTML = '';
          modalBody.appendChild(formWrapper);
          formWrapper.querySelectorAll('script').forEach(s => {
            const ns = document.createElement('script');
            ns.textContent = s.textContent;
            document.body.appendChild(ns);
          });
        } else {
          modalBody.innerHTML = '<div class="alert alert-danger">Failed to load form.</div>';
        }
      })
      .catch(() => {
        modalBody.innerHTML = '<div class="alert alert-danger">Network error. Please try again.</div>';
      });
  }
  </script>
  {% endif %}

</body>

{% endblock mainbody %}
