<!-- Add Transaction Modal -->
<div class="modal fade" id="expensemodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 14px; overflow: hidden;">
      
      <!-- Branded Modal Header -->
      <div class="modal-header txn-modal-header">
        <div class="d-flex align-items-center gap-2">
            <div class="txn-modal-icon">
                <i class="fa-solid fa-plus" style="color:#fff; font-size: 0.9rem;"></i>
            </div>
            <h5 class="modal-title txn-modal-title" id="wefef">Add Transaction</h5>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form action="/create-transaction/" id="myExpenseForm" method="post">
          {% csrf_token %}
          
          <!-- Transaction Type -->
          <div id="transactionType" class="txn-radio-group">
            <div class="txn-radio-option">
              <input type="radio" name="type" id="Expense" value="Expense" onchange="payType()" required />
              <label class="txn-radio-label" for="Expense">
                <i class="fa-solid fa-arrow-trend-down me-2" style="color: #e11d48;"></i> Expense
              </label>
            </div>
            <div class="txn-radio-option">
              <input type="radio" name="type" id="Income" value="Income" onchange="payType()" />
              <label class="txn-radio-label" for="Income">
                <i class="fa-solid fa-arrow-trend-up me-2" style="color: #10b981;"></i> Income
              </label>
            </div>
          </div>

          <div id="transactionBody" style="display: none">
            <!-- Transaction Category -->
            <div class="mb-3">
              <label class="txn-modal-label">
                <i class="fa-solid fa-tag me-1" style="color: var(--primary);"></i> Category
              </label>
              <div class="txn-pill-group" id="category">
                <!-- Categories will be populated dynamically -->
              </div>
            </div>

            <!-- Beneficiary -->
            <div class="mb-3" id="beneficiary_container">
              <label class="txn-modal-label">
                <i class="fa-solid fa-user me-1" style="color: var(--primary);"></i> Beneficiary
              </label>
              <input type="hidden" name="beneficiary" id="beneficiary" value="Self">
              <div class="txn-pill-group" style="margin-top: 5px;">
                <div class="txn-pill-option">
                  <input type="radio" name="beneficiary_radio" id="beneficiary_self" value="Self" onchange="updateBeneficiary(this)" checked>
                  <label class="txn-pill-label" for="beneficiary_self">Self</label>
                </div>
                <div class="txn-pill-option">
                  <input type="radio" name="beneficiary_radio" id="beneficiary_home" value="Home" onchange="updateBeneficiary(this)">
                  <label class="txn-pill-label" for="beneficiary_home">Home</label>
                </div>
                <div class="txn-pill-option">
                  <input type="radio" name="beneficiary_radio" id="beneficiary_other" value="Other" onchange="updateBeneficiary(this)">
                  <label class="txn-pill-label" for="beneficiary_other">Other</label>
                </div>
              </div>
            </div>

            <!-- Beneficiary if "Other" is selected -->
            <div class="mb-3" id="other_beneficiary" style="display: none">
              <label class="txn-modal-label" for="beneficiary_text">
                <i class="fa-solid fa-user-plus me-1" style="color: var(--primary);"></i> Specify Beneficiary
              </label>
              <input type="text" class="form-control txn-modal-input" id="beneficiary_text" name="beneficiary_text" placeholder="Please specify the beneficiary" />
            </div>

            <!-- Date / Amount row -->
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="txn-modal-label" for="date">
                  <i class="fa-solid fa-calendar me-1" style="color: var(--primary);"></i> Date
                </label>
                <input type="date" class="form-control txn-modal-input" name="date" id="date" required />
              </div>
              <div class="col-6">
                <label class="txn-modal-label" for="amount">
                  <i class="fa-solid fa-indian-rupee-sign me-1" style="color: var(--primary);"></i> Amount
                </label>
                <input type="number" class="form-control txn-modal-input" name="amount" id="amount" placeholder="0.00" step="0.01" required />
              </div>
            </div>

            <!-- Transaction Description -->
            <div class="mb-3">
              <label class="txn-modal-label" for="description">
                <i class="fa-solid fa-align-left me-1" style="color: var(--primary);"></i> Description
              </label>
              <input type="text" class="form-control txn-modal-input" name="description" id="description" placeholder="Brief note…" required />
            </div>

            <!-- Transaction Status -->
            <div class="mb-4" id="status_container">
              <label class="txn-modal-label">
                <i class="fa-solid fa-circle-check me-1" style="color: var(--primary);"></i> Status
              </label>
              <div class="txn-radio-group" style="margin-bottom: 0; margin-top: 5px;">
                <div class="txn-radio-option">
                  <input type="radio" name="status" id="status_completed" value="Completed" checked>
                  <label class="txn-radio-label" for="status_completed" style="padding: 8px;">Completed</label>
                </div>
                <div class="txn-radio-option">
                  <input type="radio" name="status" id="status_pending" value="Pending">
                  <label class="txn-radio-label" for="status_pending" style="padding: 8px;">Pending</label>
                </div>
              </div>
            </div>

            <!-- Submit Button -->
            <button id="submitButton" type="submit" class="txn-modal-submit w-100">
                <i class="fa-solid fa-plus-circle me-2"></i> Add Transaction
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function updateBeneficiary(radio) {
    document.getElementById("beneficiary").value = radio.value;
    beneficiary_s();
  }
</script>
