<!-- Add Transaction Modal -->
<div class="modal fade" id="expensemodal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">

      <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" id="wefef" style="color: var(--primary-dark);">
          <i class="bi bi-plus-circle me-2 text-muted"></i>Add Transaction
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form action="/create-transaction/" id="myExpenseForm" method="post">
          {% csrf_token %}

          <div id="transactionType" class="mb-4 d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input border-secondary" type="radio" name="type" id="Expense" value="Expense" onchange="payType()" required />
              <label class="form-check-label text-muted-sm fw-medium" for="Expense">Expense</label>
            </div>
            <div class="form-check">
              <input class="form-check-input border-secondary" type="radio" name="type" id="Income" value="Income" onchange="payType()" />
              <label class="form-check-label text-muted-sm fw-medium" for="Income">Income</label>
            </div>
          </div>

          <div id="transactionBody" style="display: none">

            <div class="mb-3">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="category">Category</label>
              <select class="form-select border-light-subtle rounded-3" id="category" name="category" aria-label="Select Category">
                <option value="" disabled selected>-- Select Category --</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="beneficiary">Beneficiary</label>
              <select class="form-select border-light-subtle rounded-3" name="beneficiary" id="beneficiary" onchange="beneficiary_s()">
                <option value="Self" selected>Self</option>
                <option value="Home">Home</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3" id="other_beneficiary" style="display: none">
              <input type="text" class="form-control border-light-subtle rounded-3" id="beneficiary_text" name="beneficiary_text" placeholder="Please specify the beneficiary" />
            </div>

            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label text-muted-sm fw-semibold text-uppercase" for="date">Date</label>
                <input type="date" class="form-control border-light-subtle rounded-3" name="date" id="date" required />
              </div>
              <div class="col-6">
                <label class="form-label text-muted-sm fw-semibold text-uppercase" for="amount">Amount</label>
                <input type="number" class="form-control border-light-subtle rounded-3" name="amount" id="amount" placeholder="0.00" step="0.01" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="description">Description</label>
              <input type="text" class="form-control border-light-subtle rounded-3" name="description" id="description" placeholder="Brief note" required />
            </div>

            <div class="mb-4">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="status">Status</label>
              <select class="form-select border-light-subtle rounded-3" name="status" id="status">
                <option value="Completed" selected>Completed</option>
                <option value="Pending">Pending</option>
              </select>
            </div>

            <button id="submitButton" type="submit" class="btn-premium w-100 justify-content-center">
              Add Transaction
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
