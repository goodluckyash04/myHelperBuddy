<!-- Edit Expense Modal -->

<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">

      <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" id="title_u" style="color: var(--primary-dark);">
          <i class="bi bi-pencil-square me-2 text-muted"></i>Edit Transaction
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <form action="" id="updateExpenseForm" method="post">
          {% csrf_token %}
          <div id="transactionUpdateBody">

            <div class="mb-3">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="category_u">Category</label>
              <select class="form-select border-light-subtle rounded-3" id="category_u" name="category">
                <option value="" disabled selected>— Select Category —</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="beneficiary_data">Beneficiary</label>
              <input type="text" class="form-control border-light-subtle rounded-3" name="beneficiary" id="beneficiary_data" placeholder="Self / Home / Other" />
            </div>

            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label text-muted-sm fw-semibold text-uppercase" for="date_u">Date</label>
                <input type="date" class="form-control border-light-subtle rounded-3" name="date" id="date_u" required />
              </div>
              <div class="col-6">
                <label class="form-label text-muted-sm fw-semibold text-uppercase" for="amount_u">Amount</label>
                <input type="number" class="form-control border-light-subtle rounded-3" step="0.01" name="amount" id="amount_u" placeholder="0.00" required />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted-sm fw-semibold text-uppercase" for="description_u">Description</label>
              <input type="text" class="form-control border-light-subtle rounded-3" name="description" id="description_u" placeholder="Brief note…" required />
            </div>

            <button id="submitButton" type="submit" class="btn-premium w-100 justify-content-center">
              <span id="submitBtnText">Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
