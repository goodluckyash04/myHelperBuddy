<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" id="deleteForm">
      {% csrf_token %}
      <div class="modal-content fin-modal-content">
        <div class="modal-header fin-modal-header" style="background: linear-gradient(135deg, #7f1d1d, #450a0a);">
          <h5 class="modal-title fin-modal-title">
            <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i> Delete Document
          </h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>
        </div>

        <div class="modal-body p-4 text-center">
          <div class="mb-4">
            <i class="bi bi-trash3 text-danger" style="font-size: 3.5rem; opacity: 0.8;"></i>
          </div>
          
          <h4 class="fw-bold mb-2 text-dark">Are you sure?</h4>
          <p class="mb-4 text-muted">
            You are about to permanently delete <br/>
            <span class="fw-bold text-dark fs-5" id="deleteFilename"></span>
          </p>

          <div id="deletePasswordWrap" class="mb-3 d-none text-start">
            <label class="form-label small fw-bold text-muted"><i class="bi bi-shield-lock me-1"></i> Verify Password</label>
            <input
              type="password"
              name="password"
              id="deletePassword"
              class="form-control fin-form-control"
              placeholder="Enter password to confirm"
            />
          </div>
          
          <div class="alert alert-danger mb-0 py-2" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
            <i class="bi bi-info-circle me-1"></i> This action cannot be undone.
          </div>
        </div>

        <div class="modal-footer border-0 p-4 pt-0 justify-content-center gap-2">
          <button type="button" class="btn fin-cancel-btn" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="submit" class="btn btn-danger" style="border-radius: 12px; font-weight: 600; padding: 0.6rem 1.5rem; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);">
            Yes, Delete it
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
