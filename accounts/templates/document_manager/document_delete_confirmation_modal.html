<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" id="deleteForm">
      {% csrf_token %}
      <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
        <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
          <h5 class="modal-title fw-bold" style="color: var(--primary-dark);">
            <i class="bi bi-trash-fill text-danger me-2"></i>Delete File
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-4">
          <p class="mb-3 text-muted-sm fw-medium">
            Are you sure you want to
            <span class="fw-bold text-danger">permanently delete</span> file
            <span class="fw-bold text-dark" id="deleteFilename"></span>?
          </p>

          <div id="deletePasswordWrap" class="mb-3 d-none">
            <label class="form-label text-muted-sm fw-semibold text-uppercase">Enter Password</label>
            <input type="password" name="password" id="deletePassword" class="form-control border-light-subtle rounded-3" placeholder="Required" />
          </div>
          <div class="form-text small text-danger mt-2">
            This action cannot be undone.
          </div>
        </div>

        <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
          <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger rounded-3 fw-medium">Delete</button>
        </div>
      </div>
    </form>
  </div>
</div>
