<style>
  /* Modal filename truncate */
  #pwdFileName {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
<!-- Modern Download Password Modal -->
<div class="modal fade" id="pwdModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <form id="pwdForm" method="post" class="modal-content fin-modal-content">
      {% csrf_token %}
      <div class="modal-header fin-modal-header text-center d-flex justify-content-center position-relative align-items-center" style="background: linear-gradient(-45deg, var(--primary-dark), #9a8855, var(--primary), #a69550); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: white;">
        <h5 class="modal-title fin-modal-title w-100 text-center d-flex align-items-center justify-content-center m-0">
          <i class="bi bi-shield-lock-fill text-warning me-2" style="font-size: 1.5rem;"></i>
          Secure Download
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white position-absolute"
          style="right: 15px; top: 15px;"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body p-4 text-center">
        <p class="text-muted small mb-1">Downloading file:</p>
        <p id="pwdFileName" class="fw-bold text-dark mb-4 fs-6 px-3"></p>

        <div class="mb-2 form-floating text-start position-relative">
          <input
            type="password"
            name="password"
            class="form-control fin-form-control pwd-toggle-input"
            placeholder="Password required"
            required
            autocomplete="one-time-code"
          />
          <label class="text-muted"><i class="bi bi-key me-1"></i> Document Password</label>
          <button
            class="btn btn-toggle-pwd"
            type="button"
            style="position: absolute; right: 10px; top: 12px; background: transparent; border: none; color: #9ca3af;"
            title="Show password"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
        
        <div class="form-text small text-muted mb-3">
          This file is protected. Please verify access.
        </div>
      </div>

      <div class="modal-footer border-0 p-4 pt-0 flex-column gap-2">
        <button type="submit" class="btn fin-submit-btn w-100 py-2 fs-6" id="pwdSubmitBtn">
          <i class="bi bi-cloud-download me-1"></i> Unlock & Download
        </button>
        <button
          type="button"
          class="btn fin-cancel-btn w-100"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
