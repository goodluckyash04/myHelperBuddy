<style>
  /* Modal filename truncate */
  #pwdFileName {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Slightly larger click target for eye button */
  .btn-toggle-pwd {
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-toggle-pwd i {
    font-size: 1.02rem;
  }

  /* Optional: stronger focus ring for accessibility */
  .pwd-toggle-input:focus {
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
  }
</style>
<!-- Modern Download Password Modal -->
<div class="modal fade" id="pwdModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <form id="pwdForm" method="post" class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
      {% csrf_token %}
      <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
        <h5 class="modal-title fw-bold" style="color: var(--primary-dark);">
          <i class="bi bi-lock-fill text-danger me-2"></i>Enter Password
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        <p id="pwdFileName" class="mb-3 text-muted-sm fw-medium"></p>

        <div class="mb-3">
          <div class="input-group">
            <input type="password" name="password" class="form-control border-light-subtle rounded-start-3 pwd-toggle-input" required autocomplete="one-time-code" aria-label="Download password" />
            <button class="btn btn-outline-secondary btn-toggle-pwd rounded-end-3" type="button" aria-pressed="false" title="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="form-text small mt-2">
            This file is password protected. Please enter a password to download the file.
          </div>
        </div>
      </div>

      <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
        <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn-premium" id="pwdSubmitBtn">
          <i class="bi bi-download me-1"></i> Download
        </button>
      </div>
    </form>
  </div>
</div>
