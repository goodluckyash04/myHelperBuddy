<!-- Financial Dashboard Overview -->
<style>
/* ── Fin Stat Card ─────────────────────────────────────────── */
.fin-stat-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(255, 255, 255, 1);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}
.fin-stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}
.fin-stat-card:hover {
    transform: translateY(-6px) scale(1.01);
}
.fin-stat-card--purple:hover { box-shadow: 0 15px 35px rgba(139, 92, 246, 0.25); }
.fin-stat-card--blue:hover   { box-shadow: 0 15px 35px rgba(59, 130, 246, 0.25); }
.fin-stat-card--amber:hover  { box-shadow: 0 15px 35px rgba(245, 158, 11, 0.25); }
.fin-stat-card--danger:hover { box-shadow: 0 15px 35px rgba(239, 68, 68, 0.25); }
.fin-stat-inner {
    border-radius: 18px;
    height: 100%;
}
</style>

<div class="row mx-3 mb-4 g-3">
  <!-- Total Outstanding -->
  <div class="{% if stats.overdue_count > 0 %}col-lg-3 col-md-6{% else %}col-md-4{% endif %} col-sm-6">
    <div class="fin-stat-card fin-stat-card--purple h-100">
      <div class="card-body text-center p-4 fin-stat-inner" style="background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(139,92,246,0.02) 100%);">
        <i class="fa-solid fa-wallet fa-2x mb-2" style="color: #8B5CF6;"></i>
        <h3 class="mb-1" style="font-weight: 800; color: #4c1d95;">₹ {{ stats.total_outstanding|floatformat:0 }}</h3>
        <p class="text-muted mb-0" style="font-size: 0.9rem; font-weight: 600;">Total Outstanding</p>
      </div>
    </div>
  </div>

  <!-- Active Instruments -->
  <div class="{% if stats.overdue_count > 0 %}col-lg-3 col-md-6{% else %}col-md-4{% endif %} col-sm-6">
    <div class="fin-stat-card fin-stat-card--blue h-100">
      <div class="card-body text-center p-4 fin-stat-inner" style="background: linear-gradient(135deg, rgba(59,130,246,0.08) 0%, rgba(59,130,246,0.02) 100%);">
        <i class="fa-solid fa-list-check fa-2x mb-2" style="color: #3B82F6;"></i>
        <h3 class="mb-1" style="font-weight: 800; color: #1e3a8a;">{{ stats.active_count }}</h3>
        <p class="text-muted mb-0" style="font-size: 0.9rem; font-weight: 600;">Active Instruments</p>
      </div>
    </div>
  </div>

  <!-- Due This Month -->
  <div class="{% if stats.overdue_count > 0 %}col-lg-3 col-md-6{% else %}col-md-4{% endif %} col-sm-6">
    <div class="fin-stat-card fin-stat-card--amber h-100">
      <div class="card-body text-center p-4 fin-stat-inner" style="background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0.02) 100%);">
        <i class="fa-solid fa-calendar-days fa-2x mb-2" style="color: #F59E0B;"></i>
        <h3 class="mb-1" style="font-weight: 800; color: #78350f;">₹ {{ stats.due_this_month|floatformat:0 }}</h3>
        <p class="text-muted mb-0" style="font-size: 0.9rem; font-weight: 600;">Due This Month</p>
      </div>
    </div>
  </div>

  <!-- Overdue (if any) -->
  {% if stats.overdue_count > 0 %}
  <div class="col-lg-3 col-md-6 col-sm-6">
    <div class="fin-stat-card fin-stat-card--danger h-100">
      <div class="card-body text-center p-4 fin-stat-inner" style="background: linear-gradient(135deg, rgba(239,68,68,0.08) 0%, rgba(239,68,68,0.02) 100%);">
        <i class="fa-solid fa-triangle-exclamation fa-2x mb-2" style="color: #EF4444;"></i>
        <h3 class="mb-1 text-danger" style="font-weight: 800;">{{ stats.overdue_count }}</h3>
        <p class="text-muted mb-0" style="font-size: 0.9rem; font-weight: 600;">Overdue</p>
        <small class="text-danger" style="font-weight: 700;">₹ {{ stats.overdue_amount|floatformat:0 }}</small>
      </div>
    </div>
  </div>
  {% endif %}
</div>
