{% load static %}
<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myHelperBuddy - Finance Command Center</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Simplebar -->
    <link rel="stylesheet" href="https://unpkg.com/simplebar@5.3.4/dist/simplebar.min.css" />

    <!-- Daterangepicker -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <!-- Project Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Favicon & Manifest -->
    <link rel="shortcut icon" type="image/png" href="{% static 'favicon-16x16.png' %}" />
    <link rel="manifest" href="{% static 'manifest.json' %}">

    <!-- Theme Initialization Script to prevent FOUC -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('mhb_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>
  </head>
  
  <body>
    {% block mainbody %} 
    {% endblock mainbody %} 
    
    {% block authbody %}
    {% endblock authbody %}

    <!-- Core Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/simplebar@5.3.4/dist/simplebar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.2.1/dist/chart.umd.min.js"></script>

    <!-- Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("/static/service-worker.js")
              .then(reg => console.log("Service Worker Registered!", reg))
              .catch(err => console.log("Service Worker Registration Failed!", err));
      }

      // Auto close alerts
      function autoCloseAlert() {
        window.setTimeout(function () {
          $("#autoCloseAlert").fadeTo(500, 0).slideUp(500, function () {
            $(this).remove();
          });
        }, 3000);
      }

      $(document).ready(function () {
        autoCloseAlert();
      });
    </script>
    
    {% block script %} {% endblock script %}
  </body>
</html>
