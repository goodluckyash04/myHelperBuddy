{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="myHelperBuddy — Your personal finance, tasks & productivity companion." />
    <meta name="theme-color" content="#0f0e0d" />

    <title>MyHelperBuddy — Your Personal Command Center</title>

    <!-- Preload key fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- DateRangePicker CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <!-- SimpleBar CSS -->
    <link rel="stylesheet" href="https://unpkg.com/simplebar@5.3.4/dist/simplebar.min.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{% static 'favicon-16x16.png' %}" />

    <!-- Web Manifest -->
    <link rel="manifest" href="{% static 'manifest.json' %}" />

    <!-- ★ Primary Design System — must come after resets -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Bootstrap JS (early — needed by navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <!-- Moment.js -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <!-- DateRangePicker JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.2.1/dist/chart.umd.min.js"></script>
    <!-- SimpleBar JS -->
    <script src="https://unpkg.com/simplebar@5.3.4/dist/simplebar.min.js"></script>

    <!-- Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/service-worker.js")
          .then(reg => console.log("SW Registered", reg))
          .catch(err => console.log("SW Failed", err));
      }
    </script>

    {% block style %}{% endblock style %}

    <!-- ── Theme bootstrap (runs before paint to avoid flash) ── -->
    <script>
      (function() {
        var saved = localStorage.getItem('mhb_theme') || 'dark';
        document.getElementById('html-root').setAttribute('data-theme', saved);
      })();
    </script>
  </head>

  <body>

  {% block mainbody %}{% endblock mainbody %}
  {% block authbody %}{% endblock authbody %}

  <!-- ── FOOTER ── -->
  <footer class="footer text-center">
    <p>© 2025 <span style="color: var(--gold); font-weight: 600;">myHelperBuddy</span>. All rights reserved.</p>
  </footer>

  <!-- Auto-dismiss alerts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    $(document).ready(function () {
      setTimeout(function () {
        $("#autoCloseAlert")
          .fadeTo(500, 0)
          .slideUp(500, function () { $(this).remove(); });
      }, 4000);
    });
  </script>

  {% block script %}{% endblock script %}

  </body>
</html>
