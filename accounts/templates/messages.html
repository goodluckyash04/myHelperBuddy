{% if messages %}
<div style="position: fixed; top: 80px; right: 1.25rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.6rem; pointer-events: none; max-width: 420px;">
  {% for message in messages %}
  <div
    class="alert alert-dismissible fade show"
    id="autoCloseAlert"
    role="alert"
    style="
      pointer-events: all;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-left: 4px solid
        {% if message.tags == 'success' %}var(--color-income)
        {% elif message.tags == 'error' %}var(--color-expense)
        {% elif message.tags == 'warning' %}var(--warning)
        {% else %}var(--gold){% endif %};
      border-radius: var(--radius-md);
      padding: 0.875rem 1.25rem;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      animation: fadeSlideIn 0.3s ease both;
      min-width: 260px;
    "
  >
    <div class="d-flex align-items-center gap-2">
      <i class="fa-solid
        {% if message.tags == 'success' %}fa-circle-check" style="color: var(--color-income)
        {% elif message.tags == 'error' %}fa-circle-xmark" style="color: var(--color-expense)
        {% elif message.tags == 'warning' %}fa-triangle-exclamation" style="color: var(--warning)
        {% else %}fa-circle-info" style="color: var(--gold){% endif %}; font-size: 1rem; flex-shrink: 0;"></i>
      <span style="flex: 1;">{{ message }}</span>
      <button type="button"
              class="btn-close ms-2"
              data-bs-dismiss="alert"
              aria-label="Close"
              style="font-size: 0.7rem; flex-shrink: 0;"
              onclick="this.closest('.alert').style.opacity='0'; setTimeout(()=>this.closest('.alert').remove(), 300);">
      </button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
