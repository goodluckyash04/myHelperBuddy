{% load static %}
    {% block body %}
    
    {% block style %}
    <link rel="stylesheet" href="{% static 'css/floatingButton.css' %}">
    {% endblock style %}

  <!-- Floating button — opens global Quick Entry modal (new finance system) -->
  <a href="javascript:void(0)"
     onclick="openGlobalQuickEntry()"
     class="floating-button"
     id="floatingBtn"
     title="Quick Add Entry"
     aria-label="Quick Add Transaction">
    <i class="fa-solid fa-plus" style="color:var(--secondary)"></i>
  </a>

  {% endblock body %}

  {% block script %}
  {% endblock script %}
